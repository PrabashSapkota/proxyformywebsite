services:
  - type: web
    name: livesports
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    # Puppeteer needs these system packages on Render
    # Render's native environment has Chromium available
    healthCheckPath: /api/streams
