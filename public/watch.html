<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch — LiveSports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #e63946;
      --text: #f0f0f4;
      --muted: #6b7080;
    }
    html, body {
      background: #000;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #stream-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #header.visible { opacity: 1; pointer-events: all; }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    #match-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      max-width: 40vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 12px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      transition: all 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .back-btn svg { width: 14px; height: 14px; }
    #bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 1rem 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #bottom-bar.visible { opacity: 1; pointer-events: all; }
    #bottom-bar.empty { display: none; }
    .stream-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.7);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .stream-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .stream-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      transition: opacity 0.7s ease;
    }
    #loading-splash.gone { opacity: 0; pointer-events: none; }
    .splash-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.15em;
    }
    .splash-logo span { color: var(--accent); }
    .splash-title {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
      max-width: 320px;
      text-align: center;
      line-height: 1.5;
    }
    .splash-spinner {
      width: 34px; height: 34px;
      border: 2px solid rgba(230,57,70,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading-splash">
  <div class="splash-logo">LIVE<span>SPORTS</span></div>
  <div class="splash-spinner"></div>
  <div class="splash-title" id="splash-title">Connecting to stream…</div>
</div>

<div id="header">
  <a class="logo" href="index.html">LIVE<span>SPORTS</span></a>
  <div id="match-title"></div>
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
</div>

<div id="iframe-container">
  <iframe
    id="stream-iframe"
    allowfullscreen
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    referrerpolicy="no-referrer"
    scrolling="no"
  ></iframe>
</div>

<div id="bottom-bar">
  <span style="font-size:0.7rem;color:rgba(255,255,255,0.35);margin-right:2px;letter-spacing:0.08em;text-transform:uppercase;">Feeds</span>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const iframeUrl = params.get('iframe');
  const title = decodeURIComponent(params.get('title') || 'Live Stream');
  let substreams = [];
  try { substreams = JSON.parse(decodeURIComponent(params.get('substreams') || '[]')); } catch(_) {}

  document.getElementById('match-title').textContent = title;
  document.getElementById('splash-title').textContent = title;
  document.title = title + ' — LiveSports';

  const iframeEl  = document.getElementById('stream-iframe');
  const splash    = document.getElementById('loading-splash');
  const bottomBar = document.getElementById('bottom-bar');
  const header    = document.getElementById('header');

  function loadIframe(url) {
    iframeEl.src = url;
  }

  // Load main stream
  if (iframeUrl) {
    loadIframe(decodeURIComponent(iframeUrl));
  } else {
    document.getElementById('splash-title').textContent = 'No stream URL provided.';
  }

  // Hide splash on iframe load or after 5s fallback
  iframeEl.addEventListener('load', () => setTimeout(() => splash.classList.add('gone'), 800));
  setTimeout(() => splash.classList.add('gone'), 5000);

  // Substream switcher
  if (substreams.length > 0) {
    const mainBtn = document.createElement('button');
    mainBtn.className = 'stream-btn active';
    mainBtn.textContent = 'Main';
    bottomBar.appendChild(mainBtn);
    mainBtn.addEventListener('click', () => switchTo(decodeURIComponent(iframeUrl), mainBtn));

    substreams.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'stream-btn';
      btn.textContent = s.tag || s.name || 'Alt';
      bottomBar.appendChild(btn);
      btn.addEventListener('click', () => switchTo(s.iframe, btn));
    });
  } else {
    bottomBar.classList.add('empty');
  }

  function switchTo(url, activeBtn) {
    bottomBar.querySelectorAll('.stream-btn').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
    splash.classList.remove('gone');
    loadIframe(url);
    setTimeout(() => splash.classList.add('gone'), 5000);
  }

  // Auto-hide UI on mouse idle
  let hideTimer;
  function showUI() {
    header.classList.add('visible');
    if (substreams.length > 0) bottomBar.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      header.classList.remove('visible');
      bottomBar.classList.remove('visible');
    }, 3500);
  }
  document.addEventListener('mousemove', showUI);
  document.addEventListener('touchstart', showUI);
  showUI();
</script>
</body>
</html>
