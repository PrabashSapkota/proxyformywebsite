<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch — LiveSports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Clappr Player -->
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <!-- HLS.js fallback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060608;
      --surface: #0e0f14;
      --border: #1e2030;
      --accent: #e63946;
      --text: #f0f0f4;
      --muted: #6b7080;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100%;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: linear-gradient(to bottom, rgba(6,6,8,0.95), transparent);
      transition: opacity 0.3s;
    }
    header.hidden { opacity: 0; pointer-events: none; }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    #match-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      max-width: 50vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--text); }
    .back-btn svg { width: 16px; height: 16px; }

    /* ── Player area ── */
    #player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* ── Overlay states ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: rgba(6,6,8,0.92);
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 2rem;
      transition: opacity 0.5s;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-icon { font-size: 3rem; }
    .overlay-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
    }
    .overlay-sub {
      font-size: 0.88rem;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
    }

    .spinner-lg {
      width: 52px; height: 52px;
      border: 3px solid rgba(230,57,70,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar {
      width: 260px;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      animation: progress 35s linear forwards;
    }
    @keyframes progress { from { width:0% } to { width:100% } }

    .retry-btn {
      margin-top: 0.5rem;
      padding: 0.6rem 1.8rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .retry-btn:hover { opacity: 0.85; }

    /* ── Status badge ── */
    #status-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(14,15,20,0.85);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      backdrop-filter: blur(8px);
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #status-badge.hidden { opacity: 0; }
    #status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    #status-dot.green { background: #22c55e; }
    #status-dot.orange { background: #f59e0b; }
    #status-dot.red { background: var(--accent); }
  </style>
</head>
<body>

<header id="header">
  <a class="logo" href="/">LIVE<span>SPORTS</span></a>
  <div id="match-title">Loading…</div>
  <a class="back-btn" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
</header>

<div id="player-wrap">
  <div id="player"></div>
</div>

<!-- Overlay -->
<div id="overlay">
  <div class="spinner-lg"></div>
  <div class="overlay-title">Fetching Stream</div>
  <div class="overlay-sub" id="overlay-sub">Extracting live stream link… this may take up to 30 seconds.</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<!-- Status badge -->
<div id="status-badge">
  <div id="status-dot"></div>
  <span id="status-text">Connecting…</span>
</div>

<script>
  // ── Parse URL params ──────────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const streamId = params.get('id');
  const iframeUrl = params.get('iframe');
  const title = params.get('title') || 'Live Stream';

  document.getElementById('match-title').textContent = title;
  document.title = `${title} — LiveSports`;

  // ── Auto-hide header on mouse idle ──────────────────────────────────────
  let hideTimer;
  const header = document.getElementById('header');
  document.addEventListener('mousemove', () => {
    header.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => header.classList.add('hidden'), 3000);
  });

  // ── Status badge ─────────────────────────────────────────────────────────
  const badge = document.getElementById('status-badge');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function setStatus(state, text) {
    badge.classList.remove('hidden');
    statusDot.className = '';
    statusDot.classList.add(state);
    statusText.textContent = text;
    if (state === 'green') {
      setTimeout(() => badge.classList.add('hidden'), 4000);
    }
  }

  // ── Overlay ───────────────────────────────────────────────────────────────
  const overlay = document.getElementById('overlay');
  const overlaySub = document.getElementById('overlay-sub');

  function showOverlay(icon, title, sub, showProgress = false, showRetry = false) {
    overlay.innerHTML = `
      ${icon ? `<div class="overlay-icon">${icon}</div>` : '<div class="spinner-lg"></div>'}
      <div class="overlay-title">${title}</div>
      <div class="overlay-sub">${sub}</div>
      ${showProgress ? '<div class="progress-bar"><div class="progress-fill"></div></div>' : ''}
      ${showRetry ? '<button class="retry-btn" onclick="location.reload()">Try Again</button>' : ''}
    `;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  // ── Clappr Player ─────────────────────────────────────────────────────────
  let player = null;
  let refreshTimer = null;
  const REFRESH_INTERVAL = 4 * 60 * 1000; // match server refresh

  function initPlayer(m3u8Url) {
    console.log('[Player] Loading M3U8:', m3u8Url);

    if (player) {
      try { player.destroy(); } catch(_) {}
      player = null;
    }

    player = new Clappr.Player({
      source: m3u8Url,
      parentId: '#player',
      width: '100%',
      height: '100%',
      autoPlay: true,
      mute: false,
      hlsPlayback: {
        liveSyncDurationCount: 4,
        liveMaxLatencyDurationCount: 8,
        enableWorker: true,
        lowLatencyMode: false,
      },
      events: {
        onReady: () => {
          hideOverlay();
          setStatus('green', 'Stream connected');
        },
        onError: (err) => {
          console.error('[Player] Error:', err);
          setStatus('red', 'Playback error — refreshing…');
          setTimeout(() => fetchAndPlay(), 3000);
        },
        onBuffering: () => setStatus('orange', 'Buffering…'),
        onPlay: () => setStatus('green', 'Playing'),
      }
    });
  }

  // ── Fetch M3U8 from backend ───────────────────────────────────────────────
  async function fetchAndPlay(isRefresh = false) {
    if (!streamId || !iframeUrl) {
      showOverlay('⚠', 'Missing Parameters', 'No stream ID or iframe URL provided.', false, true);
      return;
    }

    if (!isRefresh) {
      showOverlay(null, 'Fetching Stream', 'Extracting live stream link… this may take up to 35 seconds.', true);
    } else {
      setStatus('orange', 'Refreshing M3U8…');
    }

    try {
      const url = `/stream?id=${encodeURIComponent(streamId)}&iframe=${encodeURIComponent(iframeUrl)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok || !data.m3u8) {
        throw new Error(data.error || 'No M3U8 returned');
      }

      if (!isRefresh) {
        initPlayer(data.m3u8);
      } else {
        // For refresh, update source without destroying player if possible
        console.log('[Refresh] New M3U8:', data.m3u8);
        if (player) {
          try {
            player.load(data.m3u8);
            setStatus('green', 'Stream refreshed');
          } catch(_) {
            initPlayer(data.m3u8);
          }
        }
      }

      // Schedule next refresh slightly before server's refresh
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => fetchAndPlay(true), REFRESH_INTERVAL);

    } catch (err) {
      console.error('[Fetch] Error:', err.message);
      if (!isRefresh) {
        showOverlay('📡', 'Stream Unavailable', `${err.message}<br><br>The match may not be live yet, or the stream is currently offline.`, false, true);
      } else {
        setStatus('red', 'Refresh failed — retrying in 60s');
        refreshTimer = setTimeout(() => fetchAndPlay(true), 60000);
      }
    }
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  fetchAndPlay();

  // ── Cleanup on page leave ─────────────────────────────────────────────────
  window.addEventListener('beforeunload', () => {
    clearTimeout(refreshTimer);
    if (streamId) {
      navigator.sendBeacon(`/stream/${streamId}`, '{}');
    }
  });
</script>
</body>
</html>
