<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveSports — Watch Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060608;
      --surface: #0e0f14;
      --surface2: #16171f;
      --border: #1e2030;
      --accent: #e63946;
      --accent2: #ff6b6b;
      --text: #f0f0f4;
      --muted: #6b7080;
      --live: #22c55e;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      background: rgba(6,6,8,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--live);
    }
    .live-dot {
      width: 7px; height: 7px;
      background: var(--live);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.4; transform:scale(1.5); }
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1.2rem 2rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 0.4rem 1rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
      padding: 0.5rem 2rem 4rem;
    }

    /* ── Card ── */
    .card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(230,57,70,0.18);
    }
    .card:active { transform: translateY(-1px); }

    .card-img {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: var(--surface2);
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .card:hover .card-img img { transform: scale(1.04); }

    /* Blurhash placeholder */
    .card-img canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .card-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(6,6,8,0.85) 0%, transparent 50%);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-live {
      background: var(--accent);
      color: #fff;
    }
    .badge-upcoming {
      background: rgba(14,15,20,0.85);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .card-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(14,15,20,0.75);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .card-body {
      padding: 0.9rem 1rem 1rem;
    }
    .card-category {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .viewers-dot {
      width: 6px; height: 6px;
      background: var(--live);
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Play overlay ── */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 54px; height: 54px;
      background: rgba(230,57,70,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .play-circle svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }

    /* ── Loading / empty states ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 1rem;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">LIVE<span>SPORTS</span></div>
  <div class="live-pill"><div class="live-dot"></div>Live Now</div>
</header>

<div id="filter-bar"></div>

<div id="loading">
  <div class="spinner"></div>
  <span>Fetching live streams…</span>
</div>

<div id="empty">
  <span style="font-size:2rem">📡</span>
  <span>No streams found for this category.</span>
</div>

<div id="grid" style="display:none"></div>

<script>
  const grid = document.getElementById('grid');
  const filterBar = document.getElementById('filter-bar');
  const loading = document.getElementById('loading');
  const empty = document.getElementById('empty');

  let allStreams = [];
  let activeCategory = 'All';

  function isLive(stream) {
    const now = Math.floor(Date.now() / 1000);
    return now >= stream.starts_at && now <= stream.ends_at;
  }

  function formatDate(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function formatViewers(v) {
    const n = parseInt(v) || 0;
    return n > 0 ? `${n.toLocaleString()} watching` : '';
  }

  function buildCard(s, categoryId) {
    const live = isLive(s);
    const href = `watch.html?id=${s.id}&iframe=${encodeURIComponent(s.iframe)}&title=${encodeURIComponent(s.name)}`;
    const viewers = formatViewers(s.viewers);

    return `
      <a class="card" href="${href}" target="_blank" rel="noopener">
        <div class="card-img">
          <img src="${s.poster}" alt="${s.name}" loading="lazy" />
          <div class="card-img-overlay"></div>
          ${live
            ? `<div class="card-badge badge-live"><div class="live-dot"></div>LIVE</div>`
            : `<div class="card-badge badge-upcoming">🕒 ${formatDate(s.starts_at)}</div>`
          }
          <div class="card-tag">${s.tag || s.locale?.toUpperCase() || 'HD'}</div>
          <div class="play-overlay">
            <div class="play-circle">
              <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-category">${s.category_name || ''}</div>
          <div class="card-title">${s.name}</div>
          <div class="card-meta">
            ${viewers ? `<span><span class="viewers-dot"></span> ${viewers}</span>` : ''}
            ${!live ? `<span>${formatDate(s.starts_at)}</span>` : ''}
          </div>
        </div>
      </a>
    `;
  }

  function renderGrid(category) {
    const streams = category === 'All'
      ? allStreams
      : allStreams.filter(s => s.category_name === category);

    if (streams.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'flex';
    } else {
      grid.style.display = 'grid';
      empty.style.display = 'none';
      grid.innerHTML = streams.map(s => buildCard(s)).join('');
    }
  }

  function buildFilters(streams) {
    const cats = ['All', ...new Set(streams.map(s => s.category_name).filter(Boolean))];
    filterBar.innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === 'All' ? 'active' : ''}" data-cat="${c}">${c}</button>`
    ).join('');

    filterBar.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        renderGrid(activeCategory);
      });
    });
  }

  async function loadStreams() {
    try {
      const res = await fetch('/api/streams');
      const data = await res.json();

      // Real API shape: { success: true, streams: [ { category, id, streams: [...] } ] }
      allStreams = [];
      const categories = data.streams || data; // handle both wrapped and raw
      const catArray = Array.isArray(categories) ? categories : [];
      catArray.forEach(cat => {
        if (cat.streams && Array.isArray(cat.streams)) {
          cat.streams.forEach(s => {
            allStreams.push({ ...s, category_name: s.category_name || cat.category });
          });
        }
      });

      // Sort: live first
      allStreams.sort((a, b) => {
        const al = isLive(a) ? 0 : 1;
        const bl = isLive(b) ? 0 : 1;
        return al - bl || a.starts_at - b.starts_at;
      });

      loading.style.display = 'none';
      buildFilters(allStreams);
      renderGrid('All');
    } catch (err) {
      loading.innerHTML = `<span style="color:var(--accent)">⚠ Failed to load streams. Is the server running?</span>`;
      console.error(err);
    }
  }

  loadStreams();
</script>
</body>
</html>
